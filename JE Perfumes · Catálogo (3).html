<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JE Perfumes · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0b0a;--card:#171513;--tx:#f1ede4;--mut:#a69f92;--gold:#c9a45c;--line:#2c2823;--on:#15110a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f3ee;--card:#fff;--tx:#1a1815;--mut:#6e675b;--gold:#8a6a25;--line:#ddd5c6;--on:#fff;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0c0b0a;--card:#171513;--tx:#f1ede4;--mut:#a69f92;--gold:#c9a45c;--line:#2c2823;--on:#15110a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 Jost,system-ui,sans-serif;padding-bottom:96px}
header{text-align:center;padding:28px 18px 8px}
header img{width:132px;height:132px;border-radius:50%;display:block;margin:0 auto 10px}
h1{font:600 30px/1.1 "Cormorant Garamond",Georgia,serif;margin:0;letter-spacing:.02em}
header p{margin:6px 0 0;color:var(--mut)}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.tools input{width:100%;padding:11px 14px;border-radius:24px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:none;color:var(--mut);padding:6px 14px;border-radius:20px;font:inherit;font-size:14px;cursor:pointer}
.chips button.on{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px;max-width:1100px;margin:0 auto}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.info small{color:var(--mut);font-size:13px}
.info b{font:600 19px/1.15 "Cormorant Garamond",Georgia,serif;margin-bottom:8px}
.act{margin-top:auto}
.add,.send{width:100%;border:0;border-radius:8px;background:var(--gold);color:var(--on);padding:10px;font:500 15px Jost,sans-serif;cursor:pointer;text-align:center;text-decoration:none;display:block}
.step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--gold);border-radius:8px}
.step button{width:42px;height:38px;border:0;background:none;color:var(--gold);font-size:20px;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px 0}
.bar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8;display:none}
.bar.show{display:block}.bar .add{padding:14px;font-size:16px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none}
.sheet.open{display:flex;align-items:flex-end}
.panel{background:var(--bg);width:100%;max-width:560px;margin:0 auto;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h2{font:600 26px "Cormorant Garamond",Georgia,serif;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.panel h2 button{background:none;border:0;color:var(--mut);font-size:28px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row span{flex:1}.row .step{width:112px}
.panel textarea{width:100%;height:110px;margin:12px 0 4px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px/1.4 Jost,sans-serif}
.note{color:var(--mut);font-size:14px;margin:0 0 12px}
.send+.send{margin-top:10px;background:none;border:1px solid var(--gold);color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style></head><body>
<header><img id="logo" alt="JE Perfumes"><h1>JE Perfumes</h1><p>Tu esencia, nuestro aroma</p></header>
<div class="tools"><input id="q" type="search" placeholder="Buscar perfume o marca" aria-label="Buscar"><div class="chips" id="chips"></div></div>
<main class="grid" id="grid"></main>
<div class="bar" id="bar"><button class="add" id="open"></button></div>
<div class="sheet" id="sheet"><div class="panel" role="dialog" aria-label="Tu pedido">
<h2>Tu pedido <button id="close" aria-label="Cerrar">×</button></h2>
<div id="rows"></div>
<input id="nm" placeholder="Tu nombre" aria-label="Tu nombre" style="width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;margin-top:10px"><textarea id="msg" readonly aria-label="Texto del pedido"></textarea>
<p class="note">Te llevamos directo a nuestro chat. En Instagram, el pedido se copia: solo pégalo en el mensaje.</p>
<a class="send" id="wa" target="_blank" rel="noopener">Finalizar pedido por WhatsApp</a>
<a class="send" id="ig" target="_blank" rel="noopener" href="https://ig.me/m/je_perfumes17">Finalizar pedido por Instagram</a>
</div></div>

const brands=["Todos",...new Set(P.map(p=>p[1]))];
$("#chips").innerHTML=brands.map(b=>`<button data-b="${b}" class="${b==="Todos"?"on":""}">${b}</button>`).join("");
$("#chips").onclick=e=>{const b=e.target.dataset.b;if(!b)return;brand=b;document.querySelectorAll(".chips button").forEach(x=>x.classList.toggle("on",x.dataset.b===b));render()};
$("#q").oninput=render;
function ctl(k){const n=cart[k]||0;return n?`<div class="step"><button data-m="${k}" aria-label="Quitar uno">−</button><span>${n}</span><button data-p="${k}" aria-label="Agregar uno">+</button></div>`:`<button class="add" data-p="${k}">Agregar</button>`}
function render(){const t=$("#q").value.trim().toLowerCase();
const L=P.filter(p=>(brand==="Todos"||p[1]===brand)&&(p[1]+" "+p[2]).toLowerCase().includes(t));
$("#grid").innerHTML=L.length?L.map(p=>`<article class="card"><img src="${IMG[p[0]]}" alt="${p[1]} ${p[2]}" loading="lazy"><div class="info"><small>${p[1]}</small><b>${p[2]}</b><div class="act">${ctl(p[0])}</div></div></article>`).join(""):`<p class="empty">No encontramos ese perfume. Prueba con otra marca o nombre.</p>`;
bar()}
function total(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function text(){const l=P.filter(p=>cart[p[0]]).map(p=>`• ${cart[p[0]]} x ${p[1]} ${p[2]}`);const nm=$("#nm").value.trim();return "🛍️ NUEVO PEDIDO - JE Perfumes\n"+(nm?"Cliente: "+nm+"\n":"")+"\n"+l.join("\n")+"\n\n¿Me confirman disponibilidad?"}
function bar(){const n=total();$("#bar").classList.toggle("show",n>0);$("#open").textContent=`Ver mi pedido (${n})`;
$("#rows").innerHTML=P.filter(p=>cart[p[0]]).map(p=>`<div class="row"><span>${p[1]} ${p[2]}</span>${ctl(p[0])}</div>`).join("");
const m=text();$("#msg").value=m;$("#wa").href="https://wa.me/523330284362?text="+encodeURIComponent(m);
if(!n)$("#sheet").classList.remove("open")}
document.addEventListener("click",e=>{const p=e.target.closest("[data-p]"),m=e.target.closest("[data-m]");
if(p){cart[p.dataset.p]=(cart[p.dataset.p]||0)+1;render()}
if(m){const k=m.dataset.m;cart[k]=(cart[k]||1)-1;if(!cart[k])delete cart[k];render()}});
$("#open").onclick=()=>$("#sheet").classList.add("open");
$("#close").onclick=()=>$("#sheet").classList.remove("open");
$("#sheet").onclick=e=>{if(e.target.id==="sheet")$("#sheet").classList.remove("open")};
$("#ig").onclick=()=>{try{navigator.clipboard.writeText($("#msg").value)}catch(_){$("#msg").select()}};
$("#nm").oninput=()=>{const m=text();$("#msg").value=m;$("#wa").href="https://wa.me/523330284362?text="+encodeURIComponent(m)};
render();
</script></body></html>
